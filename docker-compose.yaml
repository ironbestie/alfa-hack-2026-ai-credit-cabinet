services:
  postgres:
    image: postgres:16-alpine
    container_name: alfa_credit_db
    environment:
      POSTGRES_DB: alfa_credit
      POSTGRES_USER: alfa_admin
      POSTGRES_PASSWORD: alfa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    # Зафиксированный digest вместо latest: образ не изменится между запусками.
    image: elestio/minio@sha256:e7ffdea1db8e1830237169cbc481d52604f68447ce35df8ed5062202c3e3dc29
    container_name: alfa_credit_s3
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_SERVER_URL: http://localhost:9000
    command: server --address ":9000" --console-address ":9001" /data

  redis:
    image: redis:7-alpine
    container_name: alfa_credit_redis
    ports:
      - "6379:6379"

  mocks:
    image: wiremock/wiremock:3.9.1
    container_name: alfa_credit_mocks
    ports:
      - "8089:8080"
    volumes:
      - ./mocks:/home/wiremock
    command: ["--verbose"]

  # НАШЕ ПРИЛОЖЕНИЕ
  app:
    build: .
    container_name: alfa_credit_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfa_credit
      SPRING_DATASOURCE_USERNAME: alfa_admin
      SPRING_DATASOURCE_PASSWORD: alfa_password
      APP_S3_ENDPOINT: http://minio:9000
      APP_S3_ACCESS_KEY: minioadmin
      APP_S3_SECRET_KEY: minioadmin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_MOCKS_URL: http://mocks:8080
    depends_on:
      - postgres
      - minio
      - redis
      - mocks

volumes:
  pgdata:
  minio_data: