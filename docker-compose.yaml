services:
  postgres:
    image: postgres:16-alpine
    container_name: alfa_credit_db
    environment:
      POSTGRES_DB: alfa_credit
      POSTGRES_USER: alfa_admin
      POSTGRES_PASSWORD: alfa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_admin -d alfa_credit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: elestio/minio@sha256:e7ffdea1db8e1830237169cbc481d52604f68447ce35df8ed5062202c3e3dc29
    container_name: alfa_credit_s3
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_SERVER_URL: http://localhost:9000
    command: server --address ":9000" --console-address ":9001" /data

  redis:
    image: redis:7-alpine
    container_name: alfa_credit_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  mocks:
    image: wiremock/wiremock:3.9.1
    container_name: alfa_credit_mocks
    ports:
      - "8089:8080"
    volumes:
      - ./mocks:/home/wiremock:z
    command: ["--verbose"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfa_credit_app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfa_credit
      SPRING_DATASOURCE_USERNAME: alfa_admin
      SPRING_DATASOURCE_PASSWORD: alfa_password
      APP_S3_ENDPOINT: http://minio:9000
      APP_S3_ACCESS_KEY: minioadmin
      APP_S3_SECRET_KEY: minioadmin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_MOCKS_URL: http://mocks:8080
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-http://host.docker.internal:11434}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_MODEL: ${APP_AI_MODEL:-qwen2.5:7b}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-10}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
      APP_RATE_LIMIT_CAPACITY: ${APP_RATE_LIMIT_CAPACITY:-600}
      APP_RATE_LIMIT_REFILL_PER_MINUTE: ${APP_RATE_LIMIT_REFILL_PER_MINUTE:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mocks:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_USE_MOCKS: "false"
        BACKEND_URL: http://app:8080
    container_name: alfa_credit_web
    restart: on-failure
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  pgdata:
  minio_data:
