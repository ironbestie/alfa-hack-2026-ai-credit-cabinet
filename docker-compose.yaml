version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: alfa_credit_db
    environment:
      POSTGRES_DB: alfa_credit
      POSTGRES_USER: alfa_admin
      POSTGRES_PASSWORD: alfa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: