spring:
  config:
    import: classpath:application-scorecard.yaml,classpath:application-policy.yaml
  application:
    name: credit

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  modulith:
    events:
      jpa:
        enabled: true
      republish-outstanding-events-on-restart: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alfa_credit}
    username: ${SPRING_DATASOURCE_USERNAME:alfa_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:alfa_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # <-- Hibernate только проверяет схему
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # НАСТРОЙКИ FLYWAY
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  mocks:
    url: ${APP_MOCKS_URL:http://localhost:8089}
  ai:
    base-url: ${APP_AI_BASE_URL:http://localhost:11434}
    api-key: ${APP_AI_API_KEY:}
    model: ${APP_AI_MODEL:qwen2.5:7b}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:10}
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://localhost:9000}
    access-key: ${APP_S3_ACCESS_KEY:minioadmin}
    secret-key: ${APP_S3_SECRET_KEY:minioadmin}
    bucket-name: credit-documents
    region: us-east-1

  rate-limit:
    capacity: ${APP_RATE_LIMIT_CAPACITY:60}
    refill-per-minute: ${APP_RATE_LIMIT_REFILL_PER_MINUTE:60}

  processing:
    retry-interval-ms: ${APP_PROCESSING_RETRY_INTERVAL_MS:30000}
    max-attempts: ${APP_PROCESSING_MAX_ATTEMPTS:5}
    retry-base-seconds: ${APP_PROCESSING_RETRY_BASE_SECONDS:30}
    retry-max-seconds: ${APP_PROCESSING_RETRY_MAX_SECONDS:3600}
    stuck-after-seconds: ${APP_PROCESSING_STUCK_AFTER_SECONDS:120}
    batch-size: ${APP_PROCESSING_BATCH_SIZE:20}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      mocksCircuit:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      mocksCircuit:
        timeoutDuration: 3s
  retry:
    retryAspectOrder: 2
    instances:
      mocksRetry:
        maxAttempts: 3
        waitDuration: 1000ms