spring:
  application:
    name: credit

  modulith:
    events:
      jpa:
        enabled: true
      republish-outstanding-events-on-restart: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alfa_credit}
    username: ${SPRING_DATASOURCE_USERNAME:alfa_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:alfa_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://localhost:9000}
    access-key: ${APP_S3_ACCESS_KEY:minioadmin}
    secret-key: ${APP_S3_SECRET_KEY:minioadmin}
    bucket-name: credit-documents
    region: us-east-1


  resilience4j:
    circuitbreaker:
      instances:
        bkiService:
          slidingWindowSize: 10
          failureRateThreshold: 50
          waitDurationInOpenState: 10000ms
          permittedNumberOfCallsInHalfOpenState: 3
    timelimiter:
      instances:
        bkiService:
          timeoutDuration: 3s
    retry:
      instances:
        bkiService:
          maxAttempts: 3
          waitDuration: 1000ms