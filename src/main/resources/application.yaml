spring:
  application:
    name: credit

  datasource:
    url: jdbc:postgresql://localhost:5432/alfa_credit
    username: alfa_admin
    password: alfa_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: credit-documents
    region: us-east-1