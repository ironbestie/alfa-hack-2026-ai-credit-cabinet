openapi: 3.0.1
info:
  title: Smart Credit Cabinet API
  description: API для «Умного кредитного кабинета предпринимателя» (Альфа-Хак 2026)
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

tags:
  - name: Applications
    description: Управление кредитными заявками
  - name: Manager
    description: Кабинет кредитного менеджера (Андеррайтера)
  - name: Offers
    description: Контрпредложения (H2)
  - name: Companies
    description: Справочник компаний и ЕГРЮЛ
  - name: Products
    description: Справочник кредитных продуктов
  - name: Quiz
    description: Квиз-подбор продуктов (H5)
  - name: Auth
    description: Аутентификация (Basic Auth для Swagger)

paths:
  /api/applications:
    post:
      tags: [Applications]
      summary: Создать черновик заявки
      description: Создает заявку в статусе DRAFT. Опционально поддерживает Idempotency-Key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            example: "req-12345-unique"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Неверные данные (например, сумма вне лимитов продукта)
        '404':
          description: Компания или продукт не найдены
    get:
      tags: [Applications]
      summary: Получить все заявки
      description: Возвращает заявки с пагинацией. Клиент видит только свои заявки, менеджер — все.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'

  /api/applications/{id}:
    get:
      tags: [Applications]
      summary: Получить карточку заявки
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Данные заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          description: Заявка не найдена

  /api/applications/{id}/consents:
    post:
      tags: [Applications]
      summary: Подписать согласия (БКИ и ПДн)
      description: Обязательный шаг перед отправкой заявки (218-ФЗ и 152-ФЗ).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Согласия подписаны
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Consents signed"

  /api/applications/{id}/submit:
    post:
      tags: [Applications]
      summary: Отправить заявку на рассмотрение
      description: Запускает асинхронный конвейер (ENRICHMENT -> SCORING -> DECISION). Требует наличия согласий.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Заявка отправлена
        '409':
          description: Не подписаны согласия или неверный статус

  /api/applications/{id}/timeline:
    get:
      tags: [Applications]
      summary: Получить историю событий заявки (Таймлайн)
      description: Возвращает ленту событий для трекера с пагинацией. Клиент видит только свои заявки.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '403':
          description: Нет доступа к заявке другого клиента

  /api/applications/{id}/stream:
    get:
      tags: [Applications]
      summary: SSE-поток статусов заявки
      description: Server-Sent Events для обновления трекера в реальном времени.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Поток событий (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string

  /api/applications/{id}/offers:
    get:
      tags: [Offers]
      summary: Получить контрпредложения (H2)
      description: Возвращает варианты, если заявка одобрена с изменениями (COUNTER_OFFER).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Список офферов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferResponse'

  /api/applications/{id}/accept-offer:
    post:
      tags: [Offers]
      summary: Принять контрпредложение
      description: Переводит заявку в статус SIGNING.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                offerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Оффер принят

  /api/applications/{id}/sign:
    post:
      tags: [Applications]
      summary: Подписать документы и получить деньги
      description: Переводит заявку из SIGNING в финальный статус FUNDED (имитация выдачи).
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Кредит выдан

  /api/applications/{id}/score:
    get:
      tags: [Applications]
      summary: Получить балл, грейд и факторы скоринга
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Результат скоринга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '409':
          description: Скоринг ещё не выполнен

  /api/applications/{id}/explanation:
    get:
      tags: [Applications]
      summary: Получить объяснение решения (H3)
      description: Возвращает резюме от LLM, причины (факторы скоринга) и следующие шаги.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Объяснение решения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplanationResponse'

  /api/applications/{id}/documents:
    post:
      tags: [Applications]
      summary: Загрузить документ (дозапрос)
      description: Используется, если заявка в статусе NEEDS_MORE_INFO. Допустимые форматы: PDF, JPG, JPEG, PNG. Максимальный размер: 10 МБ.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Файл загружен

  /api/quiz/recommend:
    post:
      tags: [Quiz]
      summary: Подобрать продукт по квизу (H5)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  example: "ОБОРУДОВАНИЕ"
                amount:
                  type: number
                  example: 5000000
                termMonths:
                  type: integer
                  example: 24
      responses:
        '200':
          description: Рекомендованные продукты

  /api/offers/preapproved:
    get:
      tags: [Offers]
      summary: Получить предодобренное предложение (H4)
      parameters:
        - name: inn
          in: query
          required: true
          schema:
            type: string
            example: "7703168426"
      responses:
        '200':
          description: Предодобренная сумма и условия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreapprovedOfferResponse'

  /api/companies:
    get:
      tags: [Companies]
      summary: Список компаний
      description: Компании, загруженные в систему, с пагинацией. Используется для получения companyId.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница компаний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'

  /api/companies/lookup:
    get:
      tags: [Companies]
      summary: Карточка компании по ИНН
      description: Сначала ищет компанию в БД, затем обращается в ЕГРЮЛ.
      parameters:
        - name: inn
          in: query
          required: true
          schema:
            type: string
            example: "7704983159"
      responses:
        '200':
          description: Данные компании
        '404':
          description: Компания не найдена

  /api/products:
    get:
      tags: [Products]
      summary: Список кредитных продуктов
      description: Доступные продукты с пагинацией. Используется для получения productId.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница продуктов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  /api/manager/applications/pending:
    get:
      tags: [Manager]
      summary: Очередь заявок на ручное рассмотрение
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница заявок в статусе MANUAL_REVIEW
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApplicationPage'

  /api/manager/applications/{id}/decision:
    post:
      tags: [Manager]
      summary: Вынести решение по заявке
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decisionType:
                  type: string
                  enum: [APPROVE, COUNTER_OFFER, REJECT, REQUEST_DOCS]
                approvedAmount:
                  type: number
                approvedTermMonths:
                  type: integer
                comment:
                  type: string
                reasonCode:
                  type: string
                  nullable: true
                  description: Код причины отказа из справочника R01–R06
                  example: R01
      responses:
        '200':
          description: Решение зафиксировано

  /api/manager/dlq:
    get:
      tags: [Manager]
      summary: Очередь недоставленных событий (DLQ)
      description: Заявки, обработка которых завершилась ошибкой после всех повторных попыток.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница записей DLQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterPage'

  /api/manager/dlq/{applicationId}/retry:
    post:
      tags: [Manager]
      summary: Повторить обработку из DLQ
      description: Сбрасывает счётчик попыток и возвращает заявку в очередь периодической обработки.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationIdPath'
      responses:
        '200':
          description: Заявка поставлена в очередь повторной обработки

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: "Введите логин: client или manager, пароль: password"

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: "d1b42044-9499-43b9-9f95-02ff34fc0fda"
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: "d1b42044-9499-43b9-9f95-02ff34fc0fda"
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Размер страницы (1-100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    ApiError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          example: "Заявка не найдена"
        code:
          type: string
          example: NOT_FOUND

    CreateApplicationRequest:
      type: object
      required: [companyId, productId, requestedAmount, requestedTermMonths]
      properties:
        companyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        requestedAmount:
          type: number
          example: 5000000
        requestedTermMonths:
          type: integer
          example: 24
        purpose:
          type: string
          nullable: true
          description: Цель кредита, выбранная в квизе
          example: "ОБОРУДОВАНИЕ"
        hasCollateral:
          type: boolean
          default: false
          description: Есть ли обеспечение по заявке (влияет на скоринг)

    ApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, ENRICHMENT, SCORING, DECISION, MANUAL_REVIEW, NEEDS_MORE_INFO, APPROVED, COUNTER_OFFER, REJECTED, SIGNING, FUNDED, CLOSED]
        requestedAmount:
          type: number
        requestedTermMonths:
          type: integer
        hasCollateral:
          type: boolean
        riskScore:
          type: integer
          nullable: true
        scoringDetails:
          type: string
          nullable: true
          description: JSON-массив факторов скоринга (для обратной совместимости читается и старый формат)
        approvedAmount:
          type: number
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    OfferResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        termMonths:
          type: integer
        interestRate:
          type: number
        type:
          type: string
          enum: [REQUESTED, LIMIT, GUARANTEE, COLLATERAL]
        monthlyPayment:
          type: number
          description: Аннуитетный платёж, округлённый до 100 ₽
        overpayment:
          type: number
          description: Переплата за весь срок, округлённая до 100 ₽

    ScoreResponse:
      type: object
      properties:
        score:
          type: integer
        grade:
          type: string
          enum: [A, B, C, D]
        riskLevel:
          type: string
          enum: [low, medium, high]
        factors:
          type: array
          items:
            $ref: '#/components/schemas/ScoreFactor'

    ScoreFactor:
      type: object
      properties:
        code:
          type: string
          nullable: true
          description: Код причины R01–R06
          example: R01
        name:
          type: string
        contribution:
          type: integer
        description:
          type: string

    ExplanationResponse:
      type: object
      properties:
        summary:
          type: string
          example: "Мы проанализировали вашу заявку..."
        reasons:
          type: array
          items:
            type: string
        nextSteps:
          type: array
          items:
            type: string

    PreapprovedOfferResponse:
      type: object
      properties:
        inn:
          type: string
        maxAmount:
          type: number
        termMonths:
          type: integer
        interestRate:
          type: number
        monthlyPayment:
          type: number
        overpayment:
          type: number
        confidenceLevel:
          type: string
          enum: [CALCULATED, PREAPPROVED]

    EventResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        eventType:
          type: string
        description:
          type: string
        actor:
          type: string

    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          description: Номер текущей страницы (с 0)
          example: 0
        size:
          type: integer
          description: Размер страницы
          example: 20
        totalItems:
          type: integer
          format: int64
          description: Всего элементов
          example: 42
        totalPages:
          type: integer
          description: Всего страниц
          example: 3

    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationResponse'

    EventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EventResponse'

    CompanyPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Company'

    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CreditProduct'

    PendingApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PendingApplication'

    PendingApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        score:
          type: integer
          nullable: true
        grade:
          type: string
          nullable: true
          enum: [A, B, C, D]
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeadLetterPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DeadLetterResponse'

    DeadLetterResponse:
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inn:
          type: string
          example: "7704983159"
        ogrn:
          type: string
          example: "1187746198342"
        name:
          type: string
          example: "ООО «ТехноПрогресс»"
        okved:
          type: string
          example: "62.01"
        okvedDescription:
          type: string
        directorName:
          type: string
        registrationDate:
          type: string
          format: date
        category:
          type: string
        status:
          type: string
          example: "active"
        annualRevenue:
          type: number
        totalDebt:
          type: number
        taxDebt:
          type: number
        bankRelationshipMonths:
          type: integer

    CreditProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        minAmount:
          type: number
        maxAmount:
          type: number
        minTerm:
          type: integer
        maxTerm:
          type: integer
        baseRate:
          type: number
        tags:
          type: string
          description: JSON-строка с тегами